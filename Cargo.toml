[package]
name = "halflime"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Send events from a Rust app to your HalfLime instance"
authors = ["Alex Zappa (FreshJuice)"]
license = "Apache-2.0"
repository = "https://github.com/halflime/halflime-rust"
homepage = "https://halflime.dev"
readme = "README.md"
keywords = ["analytics", "halflime", "tauri"]
categories = ["asynchronous", "api-bindings"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
